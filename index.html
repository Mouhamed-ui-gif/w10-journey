<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>W10 Journey | مطعم عالمي - الخروب</title>
<meta name="theme-color" content="#0d0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header>
  <a class="logo" href="#" onclick="window._home();return false">W10<em>J</em></a>
  <nav id="nav">
    <a href="#" onclick="window._home();return false">الرئيسية</a>
    <a href="#sec-drinks">المشروبات</a>
    <a href="#sec-book">الحجز</a>
    <a href="#sec-location">الموقع</a>
  </nav>
  <button id="burger" aria-label="القائمة"><span></span><span></span><span></span></button>
</header>

<main>
<!-- HOME: country hub -->
<section id="sec-home" class="page active">
  <div class="hero">
    <p class="tag">مطعم عالمي · الخروب · قسنطينة</p>
    <h1>W10 <em>Journey</em></h1>
    <p class="sub">اختر دولتك المفضلة واكتشف نكهاتها</p>
  </div>
  <div id="countries" class="countries"></div>
</section>

<!-- COUNTRY MENU (hidden initially) -->
<section id="sec-country" class="page">
  <button class="back-btn" onclick="window._home()">← العودة</button>
  <div class="country-header">
    <span id="cFlag" class="c-flag"></span>
    <h2 id="cName"></h2>
    <p id="cCount" class="c-count"></p>
  </div>
  <div id="cCats" class="cats"></div>
  <input type="search" id="cSearch" class="search" placeholder="ابحث في هذا القسم..." autocomplete="off">
  <div id="cItems" class="items"></div>
</section>

<!-- DRINKS -->
<section id="sec-drinks" class="page">
  <div class="section-top">
    <h2>المشروبات</h2>
    <p class="section-sub">مشروبات ساخنة وباردة ومنعشة</p>
  </div>
  <div id="dCats" class="cats"></div>
  <input type="search" id="dSearch" class="search" placeholder="ابحث عن مشروب..." autocomplete="off">
  <div id="dItems" class="items"></div>
</section>

<!-- BOOKING -->
<section id="sec-book" class="page">
  <div class="section-top">
    <h2>احجز طاولة</h2>
    <p class="section-sub">يومياً من 11:00 إلى 23:00</p>
  </div>
  <form id="form" class="form">
    <input name="name" placeholder="الاسم الكامل" required>
    <input name="phone" type="tel" placeholder="رقم الهاتف" required>
    <div class="row2">
      <input name="date" type="date" required>
      <select name="time" required><option value="">اختر الوقت</option></select>
    </div>
    <select name="guests">
      <option>1 شخص</option><option selected>2 أشخاص</option><option>3 أشخاص</option>
      <option>4 أشخاص</option><option>5 أشخاص</option><option>6+ أشخاص</option>
    </select>
    <textarea name="note" placeholder="ملاحظات (اختياري)"></textarea>
    <button type="submit" class="btn full">تأكيد الحجز</button>
  </form>
  <div id="result" class="result hidden"></div>
</section>

<!-- LOCATION -->
<section id="sec-location" class="page">
  <div class="section-top">
    <h2>الموقع</h2>
    <p class="section-sub">📍 الخروب، قسنطينة، الجزائر</p>
  </div>
  <a href="https://maps.app.goo.gl/3cf4wCbRdCJqpQpw7" target="_blank" class="btn full map-btn" rel="noopener">افتح في خرائط جوجل</a>
</section>
</main>

<footer>
  <p>W10 Journey · الخروب · قسنطينة</p>
</footer>

<div id="toast" class="toast hidden"></div>
<div id="lightbox" class="lb hidden"><button class="lb-x" aria-label="إغلاق">&times;</button><img id="lbImg" alt=""></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
